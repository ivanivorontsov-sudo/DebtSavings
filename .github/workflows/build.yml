name: Android tests

on:
  push:
    branches: [ main, 'release/**', 'feature/github-sync' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Create Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build installable debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtSavings-GitHubSync-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
